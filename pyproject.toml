[project]
name = "jev-trading-agent"
version = "0.1.0"
description = "Long-only crypto trend-following agent with backtesting, paper trading and a memecoin rug-risk screen."
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pandas>=2.1"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
